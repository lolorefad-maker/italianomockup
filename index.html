<!doctype html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex">
<meta name="description" content="Concept della home page: traduttore e interprete arabo – italiano.">
<meta property="og:title" content="Traduttore e interprete arabo – italiano · concept">
<meta property="og:description" content="Home page in italiano e arabo · scegli il colore">
<meta name="theme-color" content="#0B0F17">
<title>Traduttore Home Maiolica</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Amiri:ital,wght@0,400;0,700;1,400&family=Bodoni+Moda:ital,opsz,wght@0,6..96,400..600;1,6..96,400..600&family=IBM+Plex+Sans+Arabic:wght@400;500&family=IBM+Plex+Sans:wght@400;500&display=swap">
<style>
*,*::before,*::after{box-sizing:border-box}
:root{
  color-scheme:light;
  --night:#0B0F17;--night-2:#111724;--night-3:#1A2130;
  --ivory:#F4EFE6;--stone:#EBE4D6;--paper:#FAF7F1;
  --ink:#0E131E;--ink-2:#3C4150;--ink-3:#5C606D;
  --gold:#C6AE84;--gold-deep:#7A613A;--gold-soft:#E3D2AE;
  --line:#DDD4C3;--line-d:rgba(227,210,174,.2);
  --it-g:#009246;--it-w:#F1F2F1;--it-r:#CE2B37;--wa:#2FBF68;
  --f-display:"Bodoni Moda","Amiri",Georgia,serif;
  --f-body:"IBM Plex Sans","IBM Plex Sans Arabic","Segoe UI",system-ui,sans-serif;
  --ease:cubic-bezier(.22,.61,.36,1);--dir:1;--track:.22em;
}
html[lang="ar"]{--f-display:"Amiri","Bodoni Moda",serif;--dir:-1;--track:0}
html,body{overflow-x:clip}
body{margin:0;background:var(--ivory);color:var(--ink);font:400 17px/1.75 var(--f-body);-webkit-font-smoothing:antialiased;text-rendering:optimizeLegibility}
html[lang="ar"] body{font-size:18px;line-height:1.95}
[hidden]{display:none!important}
a{color:inherit}
p{margin:0}
h1,h2,h3{margin:0;font-family:var(--f-display);font-weight:400;letter-spacing:-.012em;color:inherit;text-wrap:balance}
html[lang="ar"] :is(h1,h2,h3){letter-spacing:0;line-height:1.5}
.ic{width:18px;height:18px;flex:none;display:block}
[dir="rtl"] .flip{transform:scaleX(-1)}
:focus-visible{outline:2px solid var(--gold);outline-offset:4px;border-radius:4px}
.wrap{max-width:1240px;margin-inline:auto;padding-inline:clamp(20px,5vw,64px)}
.label{display:flex;align-items:center;gap:14px;font:500 11.5px/1.4 var(--f-body);letter-spacing:var(--track);text-transform:uppercase;color:var(--gold-deep)}
html[lang="ar"] .label{font-size:14px}
.label .n{font:italic 400 15px/1 "Bodoni Moda",serif;letter-spacing:0;text-transform:none}
html[lang="ar"] .label .n{font:400 17px/1 "Amiri",serif}
.label::after{content:"";width:40px;height:1px;background:currentColor;opacity:.5}
h2{font-size:clamp(2.2rem,1.4rem + 2.3vw,3.5rem);line-height:1.08;margin-top:22px}
html[lang="ar"] h2{font-size:clamp(2rem,1.3rem + 2vw,3.1rem)}
.lead{font-size:1.06em;color:var(--ink-2);max-width:52ch}
.sec{padding-block:clamp(96px,11vw,168px)}
.ornament{display:flex;align-items:center;justify-content:center;gap:18px;color:var(--gold);padding-top:clamp(64px,7vw,96px)}
.ornament i{width:80px;height:1px;background:currentColor;opacity:.6}
.ornament svg{width:18px;height:18px}

/* buttons */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:12px;min-height:54px;padding:0 30px;border-radius:999px;font:500 14.5px/1.2 var(--f-body);letter-spacing:.04em;text-decoration:none;border:1px solid transparent;cursor:pointer;transition:background-color .5s var(--ease),color .5s var(--ease),border-color .5s var(--ease);white-space:nowrap}
html[lang="ar"] .btn{font-size:16px;letter-spacing:0}
.btn-gold{background:var(--gold);color:var(--night)}
.btn-gold:hover{background:var(--gold-soft)}
.btn-ink{background:var(--night);color:var(--ivory)}
.btn-ink:hover{background:var(--night-3)}
.btn .flip{transition:translate .5s var(--ease)}
.btn:hover .flip,.tlink:hover .flip,.row:hover .arr .flip{translate:calc(3px * var(--dir)) 0}
.tlink{display:inline-flex;align-items:center;gap:10px;padding-bottom:5px;border-bottom:1px solid var(--line-d);text-decoration:none;font-size:15px;transition:border-color .5s var(--ease)}
.tlink:hover{border-color:var(--gold)}
.tlink .wa{color:var(--wa)}

/* header */
.note{background:#07090F;color:#9B968B;font-size:12.5px}
.note .wrap{display:flex;justify-content:center;align-items:center;gap:10px;min-height:34px;text-align:center}
.note i{width:5px;height:5px;border-radius:50%;background:var(--gold)}
.hdr{position:sticky;top:env(safe-area-inset-top,0px);z-index:60;transition:background-color .6s var(--ease),border-color .6s var(--ease);border-bottom:1px solid transparent}
.hdr .wrap{display:flex;align-items:center;gap:26px;height:84px}
.hdr.solid{background:color-mix(in srgb,var(--ivory) 90%,transparent);-webkit-backdrop-filter:blur(14px);backdrop-filter:blur(14px);border-bottom-color:var(--line)}
.brand{display:flex;align-items:center;gap:12px;text-decoration:none;margin-inline-end:auto;min-width:0;color:var(--ink)}
.brand .mark{width:28px;height:34px;flex:none;color:var(--gold-deep)}
.brand-name{display:block;font:400 21px/1.1 "Bodoni Moda","Amiri",serif;white-space:nowrap}
html[lang="ar"] .brand-name{font:700 22px/1.3 "Amiri",serif}
.brand-tag{display:block;font:500 10.5px/1.3 var(--f-body);letter-spacing:var(--track);text-transform:uppercase;color:var(--ink-3);margin-top:4px;white-space:nowrap}
html[lang="ar"] .brand-tag{font-size:12.5px;margin-top:0}
.nav{display:flex;gap:28px}
.nav a{font:400 14.5px var(--f-body);letter-spacing:.02em;color:var(--ink-2);text-decoration:none;padding-block:8px;background:linear-gradient(currentColor,currentColor) 0 100%/0 1px no-repeat;transition:background-size .6s var(--ease),color .4s}
[dir="rtl"] .nav a{background-position:100% 100%}
.nav a:hover{background-size:100% 1px;color:var(--ink)}
.lang{display:inline-flex;align-items:center;gap:2px}
.lang button{display:inline-flex;align-items:center;gap:7px;min-height:44px;padding:0 10px;border:0;background:none;font:500 13px var(--f-body);letter-spacing:.08em;color:var(--ink-3);cursor:pointer;border-radius:999px}
.lang button[lang="ar"]{font:500 15px "IBM Plex Sans Arabic",sans-serif;letter-spacing:0}
.lang button[aria-pressed="true"]{color:var(--ink);box-shadow:inset 0 0 0 1px var(--line)}
.lang .sep{width:1px;height:16px;background:var(--line)}
.flag-it{display:inline-block;flex:none;width:15px;height:10px;border-radius:1.5px;background:linear-gradient(to right,var(--it-g) 0 33.34%,var(--it-w) 33.34% 66.67%,var(--it-r) 66.67%);box-shadow:inset 0 0 0 .5px rgba(0,0,0,.2)}
.hdr-cta{min-height:44px;padding:0 22px;font-size:13.5px}
.hdr.dark .brand,.hdr.dark .brand-name{color:var(--ivory)}
.hdr.dark .brand .mark{color:var(--gold-soft)}
.hdr.dark .brand-tag{color:#8E897F}
.hdr.dark .nav a{color:#CFC9BD}.hdr.dark .nav a:hover{color:#fff}
.hdr.dark .lang button{color:#8E897F}.hdr.dark .lang button[aria-pressed="true"]{color:var(--ivory);box-shadow:inset 0 0 0 1px var(--line-d)}
.hdr.dark .lang .sep{background:var(--line-d)}
.hdr.dark .hdr-cta{background:transparent;color:var(--ivory);border-color:rgba(227,210,174,.5)}
.hdr.dark .hdr-cta:hover{background:var(--gold);color:var(--night);border-color:var(--gold)}

/* hero */
.hero{position:relative;overflow:hidden;isolation:isolate;margin-top:-84px;padding:calc(84px + clamp(56px,7vw,112px)) 0 clamp(88px,9vw,140px);background:var(--night);color:var(--ivory)}
.hero::before{content:"";position:absolute;inset:0;z-index:-1;background:radial-gradient(55% 65% at 78% 32%,rgba(198,174,132,.13),transparent 70%),radial-gradient(70% 60% at 10% 100%,rgba(23,35,86,.9),transparent 70%)}
[dir="rtl"] .hero::before{background:radial-gradient(55% 65% at 22% 32%,rgba(198,174,132,.13),transparent 70%),radial-gradient(70% 60% at 90% 100%,rgba(23,35,86,.9),transparent 70%)}
.hero-grid{display:grid;grid-template-columns:minmax(0,1.3fr) minmax(0,.7fr);gap:clamp(40px,6vw,110px);align-items:center}
.hero .label{color:var(--gold-soft)}
.hero-t{font-size:clamp(2.7rem,1.2rem + 4vw,5.4rem);line-height:1.02;margin:30px 0 32px}
html[lang="ar"] .hero-t{font-size:clamp(2.6rem,1.3rem + 4vw,5.1rem);line-height:1.42}
.ar-w{font-family:"Amiri",serif;font-weight:400;color:var(--gold);font-size:1.02em;letter-spacing:0}
.it-w{font-family:"Bodoni Moda",serif;font-style:italic;color:var(--gold)}
.hero .lead{color:#B7B1A5;font-size:18px;max-width:48ch}
html[lang="ar"] .hero .lead{font-size:19px}
.actions{display:flex;flex-wrap:wrap;align-items:center;gap:18px 30px;margin-top:44px}
.hero .tlink{color:#E4DFD4}
.facts{display:flex;flex-wrap:wrap;gap:10px 0;margin-top:64px;padding-top:26px;border-top:1px solid var(--line-d);font:500 11.5px/1.5 var(--f-body);letter-spacing:.2em;text-transform:uppercase;color:#8E897F;max-width:560px}
html[lang="ar"] .facts{font-size:14px;letter-spacing:0}
.facts span+span::before{content:"";display:inline-block;width:4px;height:4px;margin-inline:16px;vertical-align:middle;background:var(--gold);transform:rotate(45deg)}

/* the window */
.window{position:relative;justify-self:center;width:100%;max-width:410px;aspect-ratio:4/5.25}
.w-frame{position:absolute;inset:0;border-radius:999px 999px 6px 6px;border:1px solid rgba(227,210,174,.55)}
.w-frame::after{content:"";position:absolute;inset:9px;border-radius:999px 999px 3px 3px;border:1px solid rgba(227,210,174,.28)}
.w-arch{position:absolute;inset:20px;border-radius:999px 999px 2px 2px;overflow:hidden;background:var(--night-2)}
.w-arch svg{display:block;width:100%;height:100%;opacity:.42}
.w-panel{position:absolute;inset:62px 46px 46px;border-radius:999px 999px 1px 1px;background:var(--ivory);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px;padding:30% 8% 10%;text-align:center;color:var(--ink)}
.w-lab{font:500 10.5px/1 var(--f-body);letter-spacing:.3em;text-transform:uppercase;color:var(--ink-3)}
html[lang="ar"] .w-lab{font-size:12.5px;letter-spacing:0}
.w-word{display:block;transition:opacity 1.1s var(--ease)}
.w-word.out{opacity:0}
.w-it{font:italic 400 clamp(2.1rem,1.4rem + 2.2vw,3.2rem)/1.12 "Bodoni Moda",serif}
.w-ar{font:400 clamp(2.5rem,1.6rem + 2.6vw,3.7rem)/1.45 "Amiri",serif;color:var(--gold-deep)}
.w-rule{display:flex;align-items:center;gap:12px;color:var(--gold)}
.w-rule i{width:38px;height:1px;background:currentColor}
.w-rule svg{width:9px;height:9px}
.seal{position:absolute;top:-16px;left:-30px;z-index:3;width:96px;height:96px}
[dir="rtl"] .seal{left:auto;right:-30px}
.seal-bg{fill:var(--ivory);stroke:var(--gold);stroke-width:1}
.seal-in{fill:none;stroke:rgba(198,174,132,.55);stroke-width:.7}
.seal-t{font:500 7.2px "IBM Plex Sans",sans-serif;letter-spacing:1.6px;fill:var(--ink-2)}

/* proof */
.split{display:grid;grid-template-columns:minmax(0,.95fr) minmax(0,1.05fr);gap:clamp(48px,8vw,130px);align-items:start}
.split .lead{margin-top:26px}
.nums{display:grid;grid-template-columns:1fr 1fr;border-top:1px solid var(--line)}
.nums div{padding:30px 0;border-bottom:1px solid var(--line)}
.nums div:nth-child(odd){padding-inline-end:30px;border-inline-end:1px solid var(--line)}
.nums div:nth-child(even){padding-inline-start:30px}
.nums b{display:block;font:400 clamp(3rem,2rem + 2.6vw,4.4rem)/1 "Bodoni Moda",serif;color:var(--gold-deep);font-variant-numeric:lining-nums}
.nums span{display:block;margin-top:14px;font-size:15px;color:var(--ink-2);max-width:24ch;line-height:1.55}
.credline{margin-top:34px;font-size:14.5px;color:var(--ink-3);line-height:1.8}
.credline strong{font-weight:500;letter-spacing:var(--track);text-transform:uppercase;font-size:11.5px;color:var(--gold-deep);margin-inline-end:10px}
html[lang="ar"] .credline strong{font-size:14px}

/* services list */
.svc{background:var(--stone)}
.svc-grid{display:grid;grid-template-columns:minmax(0,.8fr) minmax(0,1.2fr);gap:clamp(48px,8vw,130px);align-items:start}
.svc-side{position:sticky;top:120px}
.svc-side .lead{margin-top:26px}
.svc-side .doc{margin-top:52px;max-width:330px}
.rows{border-top:1px solid var(--line)}
.row{display:grid;grid-template-columns:48px minmax(0,1fr) 46px;gap:6px 22px;align-items:center;padding:32px 0;border-bottom:1px solid var(--line);text-decoration:none;color:var(--ink);transition:padding .7s var(--ease)}
.row:hover{padding-inline-start:14px}
.row .n{align-self:start;padding-top:10px;font:italic 400 17px/1 "Bodoni Moda",serif;color:var(--gold-deep)}
html[lang="ar"] .row .n{font:400 20px/1 "Amiri",serif;font-style:normal}
.row h3{font-size:clamp(1.65rem,1.25rem + 1.1vw,2.3rem);line-height:1.15}
.row .most{font:500 10.5px/1 var(--f-body);letter-spacing:.2em;text-transform:uppercase;color:var(--gold-deep);margin-inline-start:14px;vertical-align:.45em;white-space:nowrap}
html[lang="ar"] .row .most{font-size:13px;letter-spacing:0;vertical-align:.3em}
.row p{grid-column:2;color:var(--ink-2);font-size:16px;max-width:54ch;line-height:1.65}
.row .arr{grid-column:3;grid-row:1 / span 2;width:46px;height:46px;border:1px solid var(--line);border-radius:50%;display:grid;place-items:center;color:var(--ink);transition:background-color .6s var(--ease),border-color .6s var(--ease),color .6s var(--ease)}
.row:hover .arr{background:var(--night);border-color:var(--night);color:var(--gold-soft)}
.d-p2{fill:#E3DBC9;stroke:#CBBFA5}.d-p1{fill:#FBF8F1;stroke:#CBBFA5;filter:drop-shadow(0 22px 26px rgba(11,20,51,.13))}
.d-ln{fill:#D2C9B5}.d-emb{fill:none;stroke:#C4B89D;stroke-width:1}
.d-h{font:500 8.5px "IBM Plex Sans",sans-serif;letter-spacing:1.8px;fill:#5F6780}.d-rule{fill:#CBBFA5}
.d-sig{fill:none;stroke:#3D4560;stroke-width:1.4;stroke-linecap:round}.d-small{font:400 8px "IBM Plex Sans",sans-serif;fill:#8B8FA0}
.d-bollo{fill:#EFE5CC;stroke:#86692F;stroke-width:1;stroke-dasharray:2.2 2.2}.d-bollo-in{fill:none;stroke:#86692F;stroke-opacity:.4}
.d-bt{font:500 6px "IBM Plex Sans",sans-serif;letter-spacing:.8px;fill:#86692F}.d-bv{font:500 12px "Bodoni Moda",serif;fill:#86692F}
.d-stamp{opacity:.85}.s-o{fill:none;stroke:#86692F;stroke-width:1.6}.s-i{fill:none;stroke:#86692F;stroke-width:.8}
.s-t{font:500 7px "IBM Plex Sans",sans-serif;letter-spacing:1.3px;fill:#86692F}.s-c{font:500 13px "Bodoni Moda",serif;letter-spacing:1px;fill:#86692F}.s-c2{font:500 6.5px "IBM Plex Sans",sans-serif;letter-spacing:1px;fill:#86692F}
.docsvg{width:100%;height:auto;display:block;overflow:visible}

/* about (night) */
.about-sec{background:var(--night);color:var(--ivory)}
.about{display:grid;grid-template-columns:minmax(0,.8fr) minmax(0,1.2fr);gap:clamp(48px,8vw,130px);align-items:center}
.pwrap{position:relative;width:100%;max-width:400px;justify-self:center;padding:12px;border:1px solid rgba(227,210,174,.45);border-radius:999px 999px 8px 8px}
.portrait{position:relative;aspect-ratio:4/5;border-radius:999px 999px 3px 3px;overflow:hidden;background:linear-gradient(180deg,var(--night-3),var(--night-2))}
.portrait svg.pat{position:absolute;inset:0;width:100%;height:100%;opacity:.25}
.portrait .sil{position:absolute;inset:0;width:100%;height:100%;fill:rgba(245,240,230,.06)}
.p-cap{position:absolute;bottom:26px;inset-inline:0;margin-inline:auto;width:max-content;max-width:calc(100% - 40px);font:500 11px/1 var(--f-body);letter-spacing:.2em;text-transform:uppercase;color:#9B968B}
html[lang="ar"] .p-cap{font-size:13px;letter-spacing:0}
.about-sec .label{color:var(--gold-soft)}
.bigq{margin:30px 0 0;font:italic 400 clamp(1.9rem,1.2rem + 2.1vw,3.1rem)/1.24 "Bodoni Moda",serif;letter-spacing:-.01em}
html[lang="ar"] .bigq{font:400 clamp(1.8rem,1.2rem + 1.8vw,2.8rem)/1.7 "Amiri",serif;letter-spacing:0}
.bigq-2{margin-top:22px;font:400 clamp(1.15rem,1rem + .5vw,1.45rem)/1.8 "Amiri",serif;color:var(--gold)}
.bigq-2[lang="it"]{font:italic 400 clamp(1.1rem,1rem + .5vw,1.35rem)/1.6 "Bodoni Moda",serif}
.about-sec .lead{color:#B7B1A5;margin-top:30px}
.sign{display:flex;flex-wrap:wrap;align-items:baseline;gap:6px 18px;margin-top:40px;padding-top:26px;border-top:1px solid var(--line-d)}
.sign strong{font:italic 400 1.9rem/1.2 "Bodoni Moda",serif;color:var(--gold-soft)}
html[lang="ar"] .sign strong{font:400 1.9rem/1.4 "Amiri",serif}
.sign span{font:500 11px var(--f-body);letter-spacing:.2em;text-transform:uppercase;color:#8E897F}
html[lang="ar"] .sign span{font-size:13px;letter-spacing:0}

/* method */
.steps{list-style:none;margin:56px 0 0;padding:0;display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:clamp(28px,4vw,64px);border-top:1px solid var(--line)}
.step{padding-top:36px}
.step .n{display:block;font:italic 400 3rem/1 "Bodoni Moda",serif;color:var(--gold)}
.step h3{font-size:1.55rem;line-height:1.25;margin-top:22px}
.step p{margin-top:10px;color:var(--ink-2);font-size:16px}

/* testimonial */
.testi-sec{background:var(--stone)}
.testi{max-width:880px;margin-inline:auto;text-align:center}
.testi .label{justify-content:center}
.testi .label::before{content:"";width:40px;height:1px;background:currentColor;opacity:.5}
.qm{display:block;font:italic 400 5.5rem/.6 "Bodoni Moda",serif;color:var(--gold);margin-top:44px}
.testi blockquote{margin:22px 0 0;font:italic 400 clamp(1.6rem,1.1rem + 1.5vw,2.45rem)/1.4 "Bodoni Moda",serif}
html[lang="ar"] .testi blockquote{font:400 clamp(1.5rem,1.1rem + 1.2vw,2.2rem)/1.8 "Amiri",serif}
.testi cite{display:block;margin-top:34px;font:500 11.5px var(--f-body);font-style:normal;letter-spacing:.2em;text-transform:uppercase;color:var(--ink-3)}
html[lang="ar"] .testi cite{font-size:13.5px;letter-spacing:0}
.sample{display:inline-block;margin-top:18px;font-size:12px;color:var(--ink-3);border:1px dashed var(--line);border-radius:999px;padding:2px 12px}

/* faq */
.faq{display:grid;grid-template-columns:minmax(0,.85fr) minmax(0,1.15fr);gap:clamp(48px,8vw,130px);align-items:start}
.faq .lead{margin-top:26px}
.faq .tlink{margin-top:34px}
.acc details{border-bottom:1px solid var(--line)}
.acc details:first-child{border-top:1px solid var(--line)}
.acc summary{list-style:none;cursor:pointer;display:flex;align-items:center;justify-content:space-between;gap:28px;padding:26px 0;font:400 1.3rem/1.4 var(--f-display)}
html[lang="ar"] .acc summary{font-size:1.35rem;line-height:1.7}
.acc summary::-webkit-details-marker{display:none}
.acc summary::after{content:"";width:14px;height:14px;flex:none;color:var(--gold-deep);background:linear-gradient(currentColor,currentColor) center/14px 1px no-repeat,linear-gradient(currentColor,currentColor) center/1px 14px no-repeat;transition:transform .6s var(--ease)}
.acc details[open] summary::after{transform:rotate(45deg)}
.acc details p{padding:0 0 28px;color:var(--ink-2);max-width:60ch}

/* final */
.final{position:relative;overflow:hidden;background:var(--night);color:var(--ivory);text-align:center;padding-top:clamp(110px,12vw,180px)}
.final::before{content:"";position:absolute;inset:0;background:radial-gradient(50% 60% at 50% 100%,rgba(198,174,132,.14),transparent 70%)}
.final .wrap{position:relative;display:flex;flex-direction:column;align-items:center}
.final .label{color:var(--gold-soft)}
.final .label::before{content:"";width:40px;height:1px;background:currentColor;opacity:.5}
.final h2{font-size:clamp(2.5rem,1.4rem + 3.3vw,4.6rem);line-height:1.05;max-width:15ch}

    for (let i = 0; i < n; i++) { const x = x0 + gap + i * (w + gap); d += `M${x} 240V${y + 24 + w / 2}a${w / 2} ${w / 2} 0 0 1 ${w} 0V240`; }
    return d;
  };
  const palm = (x, h, lean) => {
    const tx = x + lean * 1.6, ty = 240 - h;
    let s = `<path d="M${x} 240q${lean} -${h * .5} ${lean * 1.6} -${h}"/>`;
    [[-150, 44], [-120, 52], [-60, 52], [-30, 44], [-175, 30], [-5, 30]].forEach(([a, l]) => {
      const r = a * Math.PI / 180, ex = tx + Math.cos(r) * l, ey = ty + Math.sin(r) * l * .55 + 18;
      s += `<path d="M${tx} ${ty}Q${tx + Math.cos(r) * l * .55} ${ty + Math.sin(r) * l * .5 - 8} ${ex.toFixed(1)} ${ey.toFixed(1)}"/>`;
    });
    return s;
  };
  return `<svg class="skyline" viewBox="0 0 1440 250" preserveAspectRatio="xMidYMax meet" role="img" aria-label="Palermo" fill="none" stroke="#C6AE84" stroke-width="1.1" stroke-linecap="round" stroke-linejoin="round">
<path d="M0 214Q180 178 360 200T720 194T1080 206T1440 188" opacity=".3"/>
<path d="${arches(40, 8, 34, 14, 150)}" opacity=".5"/>
<path d="M1110 240V102h54v138M1102 102l35-32 35 32M1128 150v-12a9 9 0 0 1 18 0v12ZM1128 196v-12a9 9 0 0 1 18 0v12Z" opacity=".55"/>
<g opacity=".9"><path d="M540 240V206h50M590 240V168h100v72M690 240V140h120v100M810 240V180h80v60M890 206h70v34"/>
<path d="M602 168a38 38 0 0 1 76 0M700 140a50 50 0 0 1 100 0M818 180a32 32 0 0 1 64 0" fill="rgba(198,174,132,.09)"/>
<path d="M632 214v-12a8 8 0 0 1 16 0v12ZM732 186v-14a8 8 0 0 1 16 0v14ZM764 186v-14a8 8 0 0 1 16 0v14ZM842 218v-10a7 7 0 0 1 14 0v10Z"/></g>
<g opacity=".7">${palm(500, 120, 8)}${palm(990, 96, -10)}</g>
<circle cx="1250" cy="70" r="20" opacity=".8"/><circle cx="1250" cy="70" r="34" opacity=".18"/>
<path d="M0 240H1440" opacity=".6"/></svg>`;
}

function applyPalette(id) {
  palette = PALETTES.some(p => p[0] === id) ? id : "nero";
  if (palette === "nero") document.documentElement.removeAttribute("data-palette");
  else document.documentElement.setAttribute("data-palette", palette);
  document.querySelectorAll("[data-pal]").forEach(b => b.setAttribute("aria-pressed", String(b.dataset.pal === palette)));

  if (cur) document.querySelectorAll(".pal-name").forEach(nm => { nm.textContent = lang === "ar" ? cur[3] : cur[2]; });

}

// The two words in the arch change slowly, with a plain fade.
function startCycler() {
  clearInterval(timer);
  if (window.matchMedia("(prefers-reduced-motion: reduce)").matches) return;
  let k = 0;
  timer = setInterval(() => {
    k = (k + 1) % PAIRS.length;
    const words = document.querySelectorAll(".w-word");
    words.forEach(w => w.classList.add("out"));
    setTimeout(() => words.forEach(w => { w.textContent = PAIRS[k][+w.dataset.i]; w.classList.remove("out"); }), 1150);
  }, 4800);
}

// Header follows the section underneath it: light text over night sections, solid ivory elsewhere.
function syncHeader() {
  const h = $("#hdr");
  if (!h) return;
  const probe = h.getBoundingClientRect().bottom + 2;
  const dark = [...document.querySelectorAll(".hero, .about-sec, .final")].some(s => { const r = s.getBoundingClientRect(); return r.top <= probe && r.bottom > probe; });
  const menu = document.documentElement.classList.contains("menu-open");
  h.classList.toggle("dark", dark || menu);
  h.classList.toggle("solid", !dark && !menu);
  const act = $(".hero .actions"), bar = $(".mbar");
  if (bar) bar.classList.toggle("show", !act || act.getBoundingClientRect().bottom < 0);
}

function render(keepScroll) {
  const y = window.scrollY;
  document.documentElement.lang = lang;
  document.documentElement.dir = lang === "ar" ? "rtl" : "ltr";
  document.documentElement.classList.remove("menu-open");
  document.documentElement.style.overflow = "";
  document.getElementById("app").innerHTML = view();
  document.title = S[lang].seo.home[0];
  startCycler();
  if (keepScroll) window.scrollTo(0, y);
  syncHeader();
}

function toggleMenu(open) {
  const m = $("#mmenu"), b = $("[data-menu]");
  if (!m || !b) return;
  if (open === undefined) open = m.hidden;
  m.hidden = !open;
  document.documentElement.classList.toggle("menu-open", open);
  document.documentElement.style.overflow = open ? "hidden" : "";
  b.setAttribute("aria-expanded", String(open));
  requestAnimationFrame(() => m.classList.toggle("open", open));
  syncHeader();
}
document.addEventListener("keydown", e => { if (e.key === "Escape") toggleMenu(false); });

document.addEventListener("click", e => {
  if (e.target.closest("[data-menu]")) { toggleMenu(); return; }
  if (e.target.closest("[data-close]")) toggleMenu(false);
  const p = e.target.closest("[data-pal]");
  if (p) { applyPalette(p.dataset.pal); return; }
  const b = e.target.closest("[data-lang]");
  if (b && b.dataset.lang !== lang) {
    lang = b.dataset.lang;
    try { localStorage.setItem("v5-lang", lang); } catch (_) {}
    render(true);
  }
});
window.addEventListener("scroll", syncHeader, { passive: true });

document.body.insertAdjacentHTML("afterbegin", DEFS);
try { const s = localStorage.getItem("v5-lang"); if (s === "ar" || s === "it") lang = s; } catch (_) {}
try { const p = localStorage.getItem("v5-palette"); if (p) palette = p; } catch (_) {}
const hp = ["nero", "smeraldo", "bordeaux", "lapis"].find(x => location.hash === "#" + x);
if (hp) palette = hp;
if (location.hash === "#ar") lang = "ar";
if (location.hash === "#it") lang = "it";
render(false);
applyPalette(palette);

</script>
