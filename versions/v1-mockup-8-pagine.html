<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"></head><body>
<title>Traduttore Arabo–Italiano</title>
<meta name="description" content="Mockup bilingue italiano / arabo per il sito di un traduttore e interprete arabo–italiano.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Amiri:wght@400;700&family=Bodoni+Moda:ital,opsz,wght@0,6..96,400..700;1,6..96,400..700&family=IBM+Plex+Sans+Arabic:wght@400;500;600&family=IBM+Plex+Sans:wght@400;500;600&display=swap">
<style>
*,*::before,*::after{box-sizing:border-box}
:root{
  --bg:#F3F5F1;--bg-alt:#E8ECE5;--surface:#FFFFFF;
  --ink:#13201B;--ink-2:#3F4D46;--ink-3:#64716A;
  --line:#D3D9D1;--line-2:#BCC6BD;
  --brand:#1E4636;--brand-hover:#153427;--on-brand:#FFFFFF;--brand-soft:#DCE7E0;
  --accent:#A87B2F;--danger:#B3261E;
  --band:#17362B;--band-ink:#E8EFEA;--band-ink-2:#A9BDB2;--band-line:rgba(232,239,234,.16);
  --ribbon:#13201B;--ribbon-ink:#D5DFD8;
  --wa:#1DA851;--wa-bg:#167F40;--wa-light:#5BD68A;
  --art-1:#2B5B48;--art-2:#122E24;--art-line:rgba(233,241,236,.13);--art-ink:#EEF3EF;--art-ink-2:#B7CBBF;
  --paper:#FDFCF8;--paper-2:#EFEDE6;--paper-line:#D8D4C8;--paper-text:#B3B8AF;--paper-ink:#4A534E;
  --sig:#23355F;--stamp:#44489A;--bollo:#EBDDB3;--bollo-ink:#7B5B1E;
  --g-title:#1A0DAB;--g-url:#4D5156;--g-desc:#474747;
  --shadow:0 1px 2px rgba(19,32,27,.06),0 14px 34px -14px rgba(19,32,27,.22);
  --header-h:76px;
  --f-display:"Bodoni Moda","Amiri","Bodoni 72",Didot,Georgia,serif;
  --f-body:"IBM Plex Sans","IBM Plex Sans Arabic","Segoe UI",system-ui,sans-serif;
  --track:.14em;--fs-body:17px;--lh-body:1.65;
  --fs-h1:clamp(2.5rem,1.5rem + 4vw,4.6rem);--lh-h1:1.04;--ls-h1:-.02em;--fw-h:500;
  --fs-h1p:clamp(2.3rem,1.5rem + 3vw,3.9rem);
  --fs-h2:clamp(1.9rem,1.35rem + 2vw,2.9rem);--lh-h2:1.1;
  --fs-h3:1.5rem;--lh-h3:1.2;
  --dir:1;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  color-scheme:dark;
  --bg:#0D1512;--bg-alt:#121C18;--surface:#16211C;
  --ink:#E4EBE6;--ink-2:#B2BFB8;--ink-3:#8A978F;
  --line:#26332D;--line-2:#34443C;
  --brand:#8FC6A9;--brand-hover:#A9D6BD;--on-brand:#0D1512;--brand-soft:#1B2D25;
  --accent:#D3A95E;--danger:#F2877E;
  --band:#183329;--ribbon:#1A2621;--ribbon-ink:#C9D4CD;
  --wa:#3BC874;
  --g-title:#8AB4F8;--g-url:#BDC1C6;--g-desc:#BDC1C6;
  --shadow:0 1px 2px rgba(0,0,0,.3),0 16px 36px -14px rgba(0,0,0,.65);
}}
:root[data-theme="dark"]{
  color-scheme:dark;
  --bg:#0D1512;--bg-alt:#121C18;--surface:#16211C;
  --ink:#E4EBE6;--ink-2:#B2BFB8;--ink-3:#8A978F;
  --line:#26332D;--line-2:#34443C;
  --brand:#8FC6A9;--brand-hover:#A9D6BD;--on-brand:#0D1512;--brand-soft:#1B2D25;
  --accent:#D3A95E;--danger:#F2877E;
  --band:#183329;--ribbon:#1A2621;--ribbon-ink:#C9D4CD;
  --wa:#3BC874;
  --g-title:#8AB4F8;--g-url:#BDC1C6;--g-desc:#BDC1C6;
  --shadow:0 1px 2px rgba(0,0,0,.3),0 16px 36px -14px rgba(0,0,0,.65);
}
html[lang="ar"]{
  --track:0;--fs-body:18px;--lh-body:1.9;
  --fs-h1:clamp(2.2rem,1.4rem + 3.4vw,4rem);--lh-h1:1.45;--ls-h1:0;--fw-h:700;
  --fs-h1p:clamp(2.1rem,1.4rem + 2.6vw,3.4rem);
  --fs-h2:clamp(1.75rem,1.3rem + 1.8vw,2.6rem);--lh-h2:1.5;
  --fs-h3:1.45rem;--lh-h3:1.5;
  --dir:-1;
}
[hidden]{display:none!important}
html,body{overflow-x:clip}
html.lock{overflow:hidden}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:var(--fs-body);line-height:var(--lh-body);-webkit-font-smoothing:antialiased;text-rendering:optimizeLegibility}
a{color:inherit}
button{font:inherit;color:inherit}
p{margin:0}
h1,h2,h3{font-family:var(--f-display);font-weight:var(--fw-h);text-wrap:balance;margin:0;color:var(--ink)}
h1{font-size:var(--fs-h1);line-height:var(--lh-h1);letter-spacing:var(--ls-h1)}
h2{font-size:var(--fs-h2);line-height:var(--lh-h2);letter-spacing:calc(var(--ls-h1) * .6)}
h3{font-size:var(--fs-h3);line-height:var(--lh-h3)}
em.hl{font-style:italic;color:var(--brand)}
html[lang="ar"] em.hl{font-style:normal}
.ic{width:20px;height:20px;flex:none;display:block}
[dir="rtl"] .flip{transform:scaleX(-1)}
.ic.flip{transition:translate .2s ease}
.sr{position:absolute!important;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap;margin:-1px}
.skip{position:absolute;inset-inline-start:16px;top:-60px;z-index:100;background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:6px;text-decoration:none}
.skip:focus{top:12px}
:focus-visible{outline:2px solid var(--brand);outline-offset:3px;border-radius:4px}
.wrap{max-width:1240px;margin-inline:auto;padding-inline:clamp(16px,4vw,48px)}
.sec{--sec-bg:var(--bg);background:var(--sec-bg);padding-block:clamp(64px,8vw,120px)}
.sec.alt{--sec-bg:var(--bg-alt)}
.lead{font-size:calc(var(--fs-body) * 1.1);color:var(--ink-2);max-width:60ch}
.eyebrow{display:flex;align-items:center;flex-wrap:wrap;gap:10px 12px;font-size:12.5px;font-weight:600;letter-spacing:var(--track);text-transform:uppercase;color:var(--brand);line-height:1.4}
html[lang="ar"] .eyebrow{font-size:14.5px}
.eyebrow::before{content:"";width:28px;height:1px;background:currentColor}
.eyebrow .pair{font-family:var(--f-display);text-transform:none;letter-spacing:0;font-weight:400;font-size:1.2em;color:var(--ink-3)}
.eyebrow .pair[lang="it"]{font-style:italic}
.eyebrow .pair[lang="ar"]{font-size:1.5em;line-height:1}
.eyebrow .tag{display:inline-flex;font-size:12px;padding:2px 10px;border-radius:999px;border:1px dashed var(--line-2);color:var(--ink-3);letter-spacing:0;text-transform:none;font-weight:500}
.sec-head{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:20px 64px;align-items:end;margin-bottom:clamp(40px,5vw,64px)}
.sec-head h2{margin-top:18px}

/* buttons */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:10px;min-height:52px;padding:0 24px;border-radius:999px;font:600 15.5px/1.2 var(--f-body);text-decoration:none;border:1px solid transparent;cursor:pointer;transition:background-color .2s,color .2s,border-color .2s;white-space:nowrap;text-align:center}
html[lang="ar"] .btn{font-size:16px}
.btn-sm{min-height:44px;padding:0 18px;font-size:14.5px}
.btn-primary{background:var(--brand);color:var(--on-brand)}
.btn-primary:hover{background:var(--brand-hover)}
.btn-ghost{background:transparent;color:var(--ink);border-color:var(--line-2)}
.btn-ghost:hover{border-color:var(--ink)}
.btn-ghost .wa{color:var(--wa)}
.btn-wa{background:var(--wa-bg);color:#fff}
.btn-wa:hover{background:#12703A}
.btn-light{background:var(--art-ink);color:var(--art-2)}
.btn-light:hover{background:#fff}
.btn-line{color:var(--art-ink);border-color:rgba(238,243,239,.35)}
.btn-line:hover{border-color:var(--art-ink)}
.btn-line .wa{color:var(--wa-light)}
.btn:hover .flip,.tile:hover .flip,.link-arrow:hover .flip,.other:hover .flip{translate:calc(4px * var(--dir)) 0}
.cta-row{display:flex;flex-wrap:wrap;gap:12px;margin-top:34px}
.micro{display:flex;align-items:center;gap:8px;margin-top:16px;font-size:14px;color:var(--ink-3)}
.micro .ic{width:18px;height:18px;color:var(--brand)}
.link-arrow{display:inline-flex;align-items:center;gap:8px;font-weight:600;color:var(--brand);text-decoration:none;margin-top:28px}
.link-arrow:hover{text-decoration:underline;text-underline-offset:5px}

/* ribbon + header */
.ribbon{background:var(--ribbon);color:var(--ribbon-ink);font-size:13px}
.ribbon .wrap{display:flex;align-items:center;justify-content:space-between;gap:12px;min-height:38px}
.rb-l{display:flex;align-items:center;gap:10px;min-width:0}
.rb-l strong{font-weight:600;letter-spacing:.04em}
.rb-l .dot{width:7px;height:7px;border-radius:50%;background:var(--accent);flex:none}
.rb-l .rb-note{opacity:.8;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.rb-btn{display:inline-flex;align-items:center;gap:6px;background:none;border:1px solid rgba(213,223,216,.3);color:inherit;border-radius:999px;padding:4px 12px;font:500 12.5px var(--f-body);cursor:pointer;flex:none}
.rb-btn:hover{border-color:var(--ribbon-ink)}
.rb-btn .ic{width:14px;height:14px}
.hdr{position:sticky;top:env(safe-area-inset-top,0px);z-index:50;background:color-mix(in srgb,var(--bg) 88%,transparent);-webkit-backdrop-filter:saturate(1.4) blur(12px);backdrop-filter:saturate(1.4) blur(12px);border-bottom:1px solid var(--line)}
.hdr .wrap{display:flex;align-items:center;gap:20px;height:var(--header-h)}
.brand{display:flex;align-items:center;gap:12px;text-decoration:none;color:var(--ink);margin-inline-end:auto;min-width:0}
.brand .mark{width:30px;height:34px;color:var(--brand);flex:none}
.brand-name{display:block;font-family:var(--f-display);font-size:21px;line-height:1.1;font-weight:500;white-space:nowrap}
html[lang="ar"] .brand-name{font-size:23px;font-weight:700;line-height:1.3}
.brand-tag{display:block;font-size:11px;letter-spacing:var(--track);text-transform:uppercase;color:var(--ink-3);margin-top:3px;white-space:nowrap}
html[lang="ar"] .brand-tag{font-size:12.5px;margin-top:0}
.nav{display:flex;align-items:center;gap:2px}
.nav>a,.dd-btn{display:inline-flex;align-items:center;gap:6px;padding:10px 12px;font:500 15px var(--f-body);color:var(--ink-2);text-decoration:none;background:none;border:0;cursor:pointer;border-radius:6px;white-space:nowrap}
html[lang="ar"] .nav>a,html[lang="ar"] .dd-btn{font-size:15.5px}
.nav>a:hover,.dd-btn:hover{color:var(--ink)}
.nav>a[aria-current="page"],.dd-btn.is-active{color:var(--brand);background-image:linear-gradient(currentColor,currentColor);background-size:calc(100% - 24px) 1.5px;background-position:center calc(100% - 3px);background-repeat:no-repeat}
.dd-btn .ic{width:16px;height:16px;transition:transform .2s}
.dd.open .dd-btn .ic{transform:rotate(180deg)}
.dd{position:relative}
.dd-panel{position:absolute;top:calc(100% + 12px);inset-inline-start:-12px;width:min(470px,80vw);background:var(--surface);border:1px solid var(--line);box-shadow:var(--shadow);padding:8px;border-radius:12px;visibility:hidden;opacity:0;transform:translateY(-4px);transition:opacity .16s,transform .16s,visibility .16s}
.dd-panel::before{content:"";position:absolute;inset-inline:0;top:-14px;height:14px}
.dd.open .dd-panel{visibility:visible;opacity:1;transform:none}
@media (hover:hover){.dd:hover .dd-panel{visibility:visible;opacity:1;transform:none}}
.dd-panel a{display:grid;grid-template-columns:40px 1fr;gap:2px 14px;padding:12px;border-radius:8px;text-decoration:none;align-items:center}
.dd-panel a:hover,.dd-panel a[aria-current="page"]{background:var(--bg)}
.dd-ic,.mini-arch{width:40px;height:46px;display:grid;place-items:center;color:var(--brand);background:var(--brand-soft);border-radius:20px 20px 4px 4px}
.dd-ic{grid-row:span 2}
.dd-t{font-weight:600;color:var(--ink);font-size:15px;line-height:1.3}
.dd-d{font-size:13.5px;color:var(--ink-3);line-height:1.4}
.lang{display:inline-flex;border:1px solid var(--line-2);border-radius:999px;padding:3px;gap:2px;flex:none}
.lang a{min-width:44px;height:32px;display:grid;place-items:center;border-radius:999px;font-size:13.5px;font-weight:600;color:var(--ink-3);text-decoration:none;padding:0 11px}
.lang a[lang="ar"]{font-family:"IBM Plex Sans Arabic",sans-serif;font-size:14.5px}
.lang a:hover{color:var(--ink)}
.lang a[aria-current="true"]{background:var(--ink);color:var(--bg)}
.menu-btn{display:none;width:44px;height:44px;place-items:center;border:1px solid var(--line-2);border-radius:50%;background:none;cursor:pointer;flex:none}
.mnav{position:fixed;inset-inline:0;bottom:0;top:var(--mnav-top,114px);z-index:49;background:var(--bg);overflow-y:auto;padding-block:8px 120px}
.mnav-links>a{display:flex;justify-content:space-between;align-items:center;padding:16px 0;border-bottom:1px solid var(--line);font-family:var(--f-display);font-size:1.75rem;line-height:1.3;text-decoration:none;color:var(--ink);font-weight:var(--fw-h)}
.mnav-links>a[aria-current="page"]{color:var(--brand)}
.mnav-h{font-size:12.5px;font-weight:600;letter-spacing:var(--track);text-transform:uppercase;color:var(--ink-3);margin-top:22px;padding-bottom:10px}
.mnav-svc{display:grid;grid-template-columns:1fr 1fr;gap:8px;padding-bottom:18px;border-bottom:1px solid var(--line)}
.mnav-svc a{display:flex;gap:12px;align-items:center;padding:10px 12px;background:var(--surface);border:1px solid var(--line);border-radius:10px;text-decoration:none;color:var(--ink);font-weight:500;font-size:15px;line-height:1.3}
.mnav-svc .mini-arch{width:32px;height:38px}
.mnav-svc .mini-arch .ic{width:17px;height:17px}
.mnav-cta{display:grid;gap:10px;margin-top:28px}
.mnav-meta{margin-top:22px;color:var(--ink-3);font-size:14.5px}
</style>
<style>
/* hero */
.hero{padding-block:clamp(40px,6vw,88px) clamp(48px,6vw,88px)}
.hero-grid,.phero-grid{display:grid;grid-template-columns:minmax(0,1.22fr) minmax(0,.9fr);gap:clamp(32px,6vw,96px);align-items:center}
.hero h1{margin-block:22px 26px}
.hero-art{position:relative;justify-self:center;width:100%;max-width:440px}
.arch{position:relative;isolation:isolate;overflow:hidden;width:100%;aspect-ratio:4/5;border-radius:999px 999px 6px 6px;background:radial-gradient(120% 80% at 50% 0%,var(--art-1),var(--art-2) 72%);color:var(--art-ink)}
.arch::after{content:"";position:absolute;inset:14px;border:1px solid rgba(238,243,239,.2);border-radius:999px 999px 2px 2px;pointer-events:none}
.lat{position:absolute;inset:0;width:100%;height:100%;display:block}
.lat-g{fill:none;stroke:var(--art-line);stroke-width:1}
.sil{position:absolute;inset:0;width:100%;height:100%;fill:rgba(238,243,239,.075)}
.arch-cap{position:absolute;inset-inline:0;bottom:24px;margin-inline:auto;width:max-content;max-width:calc(100% - 40px);display:flex;align-items:center;gap:8px;padding:7px 14px;border-radius:999px;background:rgba(8,22,17,.38);color:var(--art-ink);font-size:12.5px;-webkit-backdrop-filter:blur(4px);backdrop-filter:blur(4px)}
.arch-cap .ic{width:16px;height:16px}
.float-doc{position:absolute;inset-inline-start:-40px;bottom:70px;display:flex;align-items:center;gap:12px;padding:14px 16px;background:var(--surface);border:1px solid var(--line);border-radius:12px;box-shadow:var(--shadow);max-width:300px}
.fd-ic{width:40px;height:40px;border-radius:50%;background:var(--brand-soft);color:var(--brand);display:grid;place-items:center;flex:none}
.float-doc strong{display:block;font-size:14.5px;line-height:1.3}
.float-doc .s{display:block;font-size:13px;color:var(--ink-3);line-height:1.35}
.float-doc .ok{color:var(--brand)}
.float-pair{position:absolute;top:30px;inset-inline-end:-20px;background:var(--band);color:var(--band-ink);font-size:13px;font-weight:500;padding:8px 14px;border-radius:999px;box-shadow:var(--shadow)}
.trust{display:flex;flex-wrap:wrap;align-items:center;gap:10px 28px;margin-top:clamp(48px,6vw,80px);padding-top:22px;border-top:1px solid var(--line)}
.trust-l{font-size:12.5px;font-weight:600;letter-spacing:var(--track);text-transform:uppercase;color:var(--ink-3)}
.trust ul{list-style:none;margin:0;padding:0;display:flex;flex-wrap:wrap;gap:6px 0;color:var(--ink-2);font-weight:500}
.trust li+li::before{content:"·";margin-inline:12px;color:var(--line-2)}

/* services tiles */
.tiles{display:grid;grid-template-columns:repeat(6,minmax(0,1fr));gap:1px;background:var(--line);border:1px solid var(--line)}
.tile{grid-column:span 2;display:flex;flex-direction:column;gap:14px;padding:clamp(24px,3vw,40px);background:var(--sec-bg);text-decoration:none;color:var(--ink);transition:background-color .2s;min-height:320px}
.tile:nth-child(n+4){grid-column:span 3}
.tile:hover{background:var(--surface)}
.tile-ic{width:48px;height:56px;display:grid;place-items:center;border:1px solid var(--line-2);border-radius:24px 24px 3px 3px;color:var(--brand);margin-bottom:8px}
.tile-ic .ic{width:22px;height:22px}
.tile h3{font-size:1.65rem}
.tile p{color:var(--ink-2);font-size:16px;max-width:46ch}
.tile .ex{font-size:13.5px;color:var(--ink-3)}
.more{margin-top:auto;display:inline-flex;gap:8px;align-items:center;font-weight:600;font-size:15px;color:var(--brand)}

/* band + stats */
.band{position:relative;overflow:hidden;background:var(--band);color:var(--band-ink);padding-block:clamp(64px,8vw,112px)}
.band h2{color:var(--band-ink)}
.band .eyebrow{color:var(--band-ink-2)}
.band .eyebrow .pair{color:var(--band-ink-2);opacity:.8}
.band .lead{color:var(--band-ink-2)}
.band-lat{position:absolute;inset-block:0;inset-inline-end:0;width:48%;height:100%;-webkit-mask-image:linear-gradient(to left,#000,transparent);mask-image:linear-gradient(to left,#000,transparent)}
[dir="rtl"] .band-lat{-webkit-mask-image:linear-gradient(to right,#000,transparent);mask-image:linear-gradient(to right,#000,transparent)}
.band .wrap{position:relative}
.stats{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));border-top:1px solid var(--band-line)}
.stat{padding:28px 24px 0;border-inline-start:1px solid var(--band-line)}
.stat:first-child{border-inline-start:0;padding-inline-start:0}
.num{display:block;font-family:"Bodoni Moda",Georgia,serif;font-size:clamp(2.6rem,4.4vw,3.9rem);line-height:1;font-weight:500;font-variant-numeric:lining-nums tabular-nums}
.lbl{display:block;margin-top:14px;color:var(--band-ink-2);font-size:15px;max-width:24ch;line-height:1.5}

/* split + docs */
.split{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:clamp(40px,6vw,96px);align-items:center}
.split h2{margin-block:18px 20px}
.checks{list-style:none;margin:32px 0 0;padding:0;display:grid;grid-template-columns:1fr 1fr;gap:12px 24px}
.checks li{display:flex;gap:10px;align-items:flex-start;font-weight:500;line-height:1.45}
.checks .ic{width:18px;height:18px;color:var(--brand);margin-top:3px}
.doc-panel{background:var(--bg-alt);border-radius:999px 999px 10px 10px;padding:22% 7% 7%;overflow:hidden}
.sec.alt .doc-panel{background:var(--surface)}
.docsvg{width:100%;height:auto;display:block;overflow:visible}
.d-p2{fill:var(--paper-2);stroke:var(--paper-line)}
.d-p1{fill:var(--paper);stroke:var(--paper-line);filter:drop-shadow(0 18px 22px rgba(19,32,27,.16))}
.d-ln{fill:var(--paper-text)}
.d-emb{fill:none;stroke:var(--paper-text);stroke-width:1.2}
.d-h{font:600 8.5px "IBM Plex Sans",sans-serif;letter-spacing:1.8px;fill:var(--paper-ink)}
.d-rule{fill:var(--paper-line)}
.d-sig{fill:none;stroke:var(--sig);stroke-width:1.6;stroke-linecap:round;stroke-linejoin:round}
.d-small{font:400 8px "IBM Plex Sans",sans-serif;fill:var(--paper-text)}
.d-bollo{fill:var(--bollo);stroke:var(--bollo-ink);stroke-width:1.2;stroke-dasharray:2.2 2.2}
.d-bollo-in{fill:none;stroke:var(--bollo-ink);stroke-opacity:.45}
.d-bt{font:600 6px "IBM Plex Sans",sans-serif;letter-spacing:.8px;fill:var(--bollo-ink)}

.seo-checks .val{color:var(--ink-3);font-size:13.5px;text-align:end;max-width:260px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.st{width:24px;height:24px;border-radius:50%;display:grid;place-items:center;background:var(--brand-soft);color:var(--brand);font-weight:700;font-size:13px}
.st .ic{width:14px;height:14px}
.st.warn{background:color-mix(in srgb,var(--accent) 22%,transparent);color:var(--accent)}
.kw-l{margin-top:20px;font-size:12.5px;font-weight:600;letter-spacing:var(--track);text-transform:uppercase;color:var(--ink-3)}
.chips{display:flex;flex-wrap:wrap;gap:8px;margin-top:10px}
.chip{font-size:13.5px;padding:5px 12px;border-radius:999px;background:var(--brand-soft);color:var(--ink)}
.seo-note{margin-top:20px;font-size:13.5px;color:var(--ink-3)}

/* entrance */
@media (prefers-reduced-motion:no-preference){
  main.enter{animation:enter .45s cubic-bezier(.2,.7,.2,1) both}
  @keyframes enter{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}

/* responsive */
@media (max-width:1179px){
  .nav,.hdr-cta{display:none}
  .menu-btn{display:grid}
  :root{--header-h:66px}
}
@media (max-width:979px){
  .hero-grid,.phero-grid,.about-grid,.split,.faq,.tl-wrap,.contact-grid,.note{grid-template-columns:minmax(0,1fr)}
  .sec-head{grid-template-columns:minmax(0,1fr)}
  .hero-art,.phero-art{max-width:400px}
  .float-doc{inset-inline-start:10px;bottom:30px}
  .float-pair{inset-inline-end:10px}
  .tiles{grid-template-columns:repeat(2,minmax(0,1fr))}
  .tile,.tile:nth-child(n+4){grid-column:span 1}
  .tile:first-child{grid-column:span 2}
  .stats{grid-template-columns:repeat(2,minmax(0,1fr))}
  .stat:nth-child(3){border-inline-start:0;padding-inline-start:0}
  .stat:nth-child(n+3){margin-top:28px;border-top:1px solid var(--band-line)}
  .items{grid-template-columns:repeat(2,minmax(0,1fr))}
  .quotes,.values{grid-template-columns:minmax(0,1fr)}
  .faq-side{position:static}
  .facts,.others{grid-template-columns:repeat(2,minmax(0,1fr))}
  .langs{grid-template-columns:minmax(0,1fr)}
  .foot-grid{grid-template-columns:1fr 1fr}
  .about-grid .arch{max-width:360px}
}
@media (max-width:759px){
  .fab{display:none}
  .mbar{display:grid}
  .foot{padding-bottom:110px}
  .steps{grid-template-columns:minmax(0,1fr);gap:24px}
  .step{display:grid;grid-template-columns:48px 1fr;gap:0 18px}
  .step h3{margin-top:10px}
  .step p{grid-column:2}
  .step:not(:last-child)::after{display:none}
  .rb-l .rb-note{display:none}
}
@media (max-width:639px){
  .tiles{grid-template-columns:minmax(0,1fr)}
  .tile:first-child{grid-column:auto}
  .tile{min-height:0}
  .items,.others,.foot-grid,.fgrid{grid-template-columns:minmax(0,1fr)}
  .checks{grid-template-columns:minmax(0,1fr)}
  .brand-tag{display:none}
  .hero-art{max-width:340px}
  .float-doc{max-width:250px;padding:12px}
  .timeline li{grid-template-columns:76px 1fr;gap:14px}
  .tl-y{font-size:1.45rem}
  .mnav-svc{grid-template-columns:minmax(0,1fr)}
  .form-foot .btn{width:100%}
  .ccard{grid-template-columns:44px minmax(0,1fr)}
  .ccard .copy{grid-column:2;justify-self:start}
}
@media (max-width:400px){
  .btn{white-space:normal}
  .facts{grid-template-columns:minmax(0,1fr)}
  .stats{grid-template-columns:minmax(0,1fr)}
  .stat,.stat:nth-child(3){border-inline-start:0;padding-inline-start:0;margin-top:0;border-top:1px solid var(--band-line)}
  .stat:first-child{border-top:0}
  .stat{padding-block:20px}
}

let state={lang:"it",page:"home"};
const $=(s,r=document)=>r.querySelector(s),$$=(s,r=document)=>[...r.querySelectorAll(s)];
const href=(p,l=state.lang)=>`#${l}-${p}`;
const esc=s=>String(s).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const waLink=t=>`https://wa.me/${WA_NUM}?text=${encodeURIComponent(t.ui.waText)}`;
const bdi=s=>`<bdi dir="ltr">${s}</bdi>`;
function eyebrow(pair,t,extra=""){const o=t.other;return `<p class="eyebrow"><span>${pair[0]}</span>${pair[1]?`<span class="pair" lang="${o}" dir="${o==="ar"?"rtl":"ltr"}">${pair[1]}</span>`:""}${extra}</p>`}
function ctaRow(t,light){return `<div class="cta-row"><a class="btn ${light?"btn-light":"btn-primary"}" href="${href("contatti")}">${t.ui.ctaLong}${I.arrow}</a><a class="btn ${light?"btn-line":"btn-ghost"}" href="${waLink(t)}" target="_blank" rel="noopener">${I.wa}${t.ui.waLong}</a></div>`}
function micro(t){return `<p class="micro">${I.checkC}${t.ui.micro}</p>`}
function portrait(t){return `<div class="arch">${LAT}<svg class="sil" viewBox="0 0 400 500" preserveAspectRatio="xMidYMax meet" aria-hidden="true"><circle cx="200" cy="232" r="64"/><path d="M62 500c8-112 70-172 138-172s130 60 138 172z"/></svg><span class="arch-cap">${I.camera}${t.ui.portrait}</span></div>`}
function typeArch(w){return `<div class="arch arch-type" aria-hidden="true">${LAT}<span class="tw-ar" lang="ar" dir="rtl">${w.ar}</span><span class="tw-mid"><i></i>AR · IT<i></i></span><span class="tw-it" lang="it">${w.it}</span></div>`}
function crumbs(t,items){return `<nav aria-label="Breadcrumb"><ol class="crumbs">${items.map((c,i)=>`<li>${c[1]?`<a href="${href(c[1])}">${c[0]}</a>`:`<span aria-current="page">${c[0]}</span>`}</li>${i<items.length-1?`<li aria-hidden="true">${I.chevR}</li>`:""}`).join("")}</ol></nav>`}
function langSwitch(t){const p=state.page;return `<div class="lang" role="group" aria-label="${t.ui.lang}"><a href="#it-${p}" lang="it" ${state.lang==="it"?'aria-current="true"':""}>IT</a><a href="#ar-${p}" lang="ar" ${state.lang==="ar"?'aria-current="true"':""}>عربي</a></div>`}

function header(t){
 const p=state.page,cur=x=>p===x?' aria-current="page"':"";
 return `<a class="skip" href="#main">${state.lang==="ar"?"تخطَّ إلى المحتوى":"Salta al contenuto"}</a>
 <div class="ribbon"><div class="wrap"><span class="rb-l"><span class="dot"></span><strong>${t.ui.mock}</strong><span class="rb-note">${t.ui.mockNote}</span></span><button type="button" class="rb-btn" data-seo>${I.search}${t.ui.seoBtn}</button></div></div>
 <header class="hdr" id="hdr"><div class="wrap">
  <a class="brand" href="${href("home")}">${LOGO}<span><span class="brand-name">${t.ui.brand}</span><span class="brand-tag">${t.ui.brandTag}</span></span></a>
  <nav class="nav" aria-label="${t.ui.menu}">
   <a href="${href("home")}"${cur("home")}>${t.nav.home}</a>
   <a href="${href("chi-sono")}"${cur("chi-sono")}>${t.nav["chi-sono"]}</a>
   <div class="dd"><button type="button" class="dd-btn${SERVICES.includes(p)?" is-active":""}" aria-expanded="false" data-dd>${t.nav.services}${I.chev}</button>
    <div class="dd-panel">${SERVICES.map(s=>`<a href="${href(s)}"${cur(s)}><span class="dd-ic">${I[SVC_ICON[s]]}</span><span class="dd-t">${t.svc[s].name}</span><span class="dd-d">${t.svc[s].short}</span></a>`).join("")}</div></div>
   <a href="${href("lezioni")}"${cur("lezioni")}>${t.nav.lezioni}</a>
   <a href="${href("contatti")}"${cur("contatti")}>${t.nav.contatti}</a>
  </nav>
  ${langSwitch(t)}
  <a class="btn btn-primary btn-sm hdr-cta" href="${href("contatti")}">${t.ui.cta}</a>
  <button type="button" class="menu-btn" aria-expanded="false" aria-controls="mnav" data-menu>${I.menu}<span class="sr">${t.ui.menu}</span></button>
 </div></header>
 <div class="mnav" id="mnav" hidden><div class="wrap">
  <nav class="mnav-links" aria-label="${t.ui.menu}">
   <a href="${href("home")}"${cur("home")}>${t.nav.home}${I.arrow}</a>
   <a href="${href("chi-sono")}"${cur("chi-sono")}>${t.nav["chi-sono"]}${I.arrow}</a>
   <p class="mnav-h">${t.nav.services}</p>
   <div class="mnav-svc">${SERVICES.map(s=>`<a href="${href(s)}"${cur(s)}><span class="mini-arch">${I[SVC_ICON[s]]}</span>${t.svc[s].name}</a>`).join("")}</div>
   <a href="${href("lezioni")}"${cur("lezioni")}>${t.nav.lezioni}${I.arrow}</a>
   <a href="${href("contatti")}"${cur("contatti")}>${t.nav.contatti}${I.arrow}</a>
  </nav>
  <div class="mnav-cta"><a class="btn btn-primary" href="${href("contatti")}">${t.ui.ctaLong}</a><a class="btn btn-ghost" href="${waLink(t)}" target="_blank" rel="noopener">${I.wa}${t.ui.waLong}</a></div>
  <p class="mnav-meta">${bdi(PHONE)} · ${bdi(EMAIL)}</p>
 </div></div>`;
}

 return `<footer class="foot"><div class="wrap">

   <div class="foot-brand"><a class="brand" href="${href("home")}">${LOGO}<span><span class="brand-name">${t.ui.brand}</span><span class="brand-tag">${t.ui.brandTag}</span></span></a><p>${t.ui.footTag}</p>${langSwitch(t)}</div>
   <div><p class="foot-h">${t.ui.footSvc}</p><ul>${ALLSVC.map(s=>`<li><a href="${href(s)}">${t.svc[s].name}</a></li>`).join("")}</ul></div>
   <div><p class="foot-h">${t.ui.footStudio}</p><ul><li><a href="${href("home")}">${t.nav.home}</a></li><li><a href="${href("chi-sono")}">${t.nav["chi-sono"]}</a></li><li><a href="${href("contatti")}">${t.nav.contatti}</a></li><li><span class="fl">${t.ui.privacy}</span></li><li><span class="fl">${t.ui.cookie}</span></li></ul></div>

function faqSec(t,items){
 return `<div class="wrap faq"><div class="faq-side">${eyebrow(t.eb.faq,t)}<h2>${t.ui.faq}</h2><p class="lead">${t.ui.faqLead}</p><a class="btn btn-ghost" href="${waLink(t)}" target="_blank" rel="noopener">${I.wa}${t.ui.waLong}</a></div>
 <div class="acc">${items.map(([q,a],i)=>`<details${i===0?" open":""}><summary>${q}<span class="pl">${I.plus}</span></summary><p class="ans">${a}</p></details>`).join("")}</div></div>`;
}
function stepsSec(t,title,lead,steps){
 return `<div class="wrap"><div class="sec-head"><div>${eyebrow(t.eb.how,t)}<h2>${title}</h2></div>${lead?`<p class="lead">${lead}</p>`:""}</div>
 <ol class="steps" style="--n:${steps.length}">${steps.map(([a,b],i)=>`<li class="step"><span class="step-n">${i+1}</span><h3>${a}</h3><p>${b}</p></li>`).join("")}</ol></div>`;
}
function ctaBand(t){
 return `<section class="cta-band">${LAT}<div class="wrap cta-in"><div><h2>${t.ui.ctaT}</h2><p>${t.ui.ctaS}</p></div>${ctaRow(t,true)}</div></section>`;
}
function sections(list){return list.filter(Boolean).map((html,i)=>`<section class="sec${i%2===0?" alt":""}">${html}</section>`).join("")}
function vHome(t){
 const h=t.home;
 const hero=`<section class="hero"><div class="wrap">
  <div class="hero-grid">
   <div><p class="eyebrow"><span>${h.eyebrow}</span></p><h1>${h.h1}</h1><p class="lead">${h.lead}</p>${ctaRow(t)}${micro(t)}</div>
   <div class="hero-art">${portrait(t)}
    <div class="float-doc"><span class="fd-ic">${I.seal}</span><span><strong>${t.ui.floatT}</strong><span class="s">${t.ui.floatS}</span></span><span class="ok">${I.checkC}</span></div>
    <span class="float-pair">${t.ui.pairWord}</span>
   </div>
  </div>
  <div class="trust"><span class="trust-l">${h.trustL}</span><ul>${h.trust.map(x=>`<li>${x}</li>`).join("")}</ul></div>
 </div></section>`;
 const svc=`<section class="sec alt" id="servizi"><div class="wrap">
  <div class="sec-head"><div>${eyebrow(t.eb.svc,t)}<h2>${h.svcT}</h2></div><p class="lead">${h.svcL}</p></div>
  <div class="tiles">${ALLSVC.map(s=>{const x=t.svc[s];return `<a class="tile" href="${href(s)}"><span class="tile-ic">${I[SVC_ICON[s]]}</span><h3>${x.name}</h3><p>${x.tile}</p><p class="ex">${x.ex}</p><span class="more">${t.ui.discover}${I.arrow}</span></a>`}).join("")}</div>
 </div></section>`;
 const band=`<section class="band"><svg class="band-lat" aria-hidden="true"><rect width="100%" height="100%" fill="url(#lat)"/></svg><div class="wrap">
  <div class="sec-head"><div>${eyebrow(t.eb.why,t)}<h2>${h.whyT}</h2></div><p class="lead">${h.whyL}</p></div>
  <div class="stats">${h.stats.map(([n,l])=>`<div class="stat"><span class="num">${bdi(n)}</span><span class="lbl">${l}</span></div>`).join("")}</div>
 </div></section>`;
 const docs=`<section class="sec"><div class="wrap split">
  <div>${eyebrow(t.eb.docs,t)}<h2>${h.docsT}</h2><p class="lead">${h.docsL}</p>
   <ul class="checks">${h.docs.map(d=>`<li>${I.check}<span>${d}</span></li>`).join("")}</ul>
   <a class="link-arrow" href="${href("asseverazioni")}">${h.docsLink}${I.arrow}</a></div>
  <div class="doc-panel">${DOC_SVG}</div>
 </div></section>`;
 const rest=sections([
  stepsSec(t,h.howT,h.howL,t.steps),
  `<div class="wrap"><div class="sec-head"><div>${eyebrow(t.eb.quotes,t,`<span class="tag">${t.ui.sample}</span>`)}<h2>${h.quotesT}</h2></div></div>
   <div class="quotes">${h.quotes.map(([q,a,r])=>`<figure class="quote">${I.quote}<blockquote>${q}</blockquote><figcaption><strong>${a}</strong>${r}</figcaption></figure>`).join("")}</div></div>`,
  faqSec(t,h.faq)
 ]);
 return hero+svc+band+docs+rest+ctaBand(t);
}

function vService(t,s){
 const x=t.svc[s],isLez=s==="lezioni";
 const cr=isLez?[[t.ui.home,"home"],[x.name]]:[[t.ui.home,"home"],[t.ui.services],[x.name]];
 const art=s==="asseverazioni"?`<div class="doc-panel">${DOC_SVG}</div>`:typeArch(ART[s]);
 const hero=`<section class="phero"><div class="wrap">${crumbs(t,cr)}
  <div class="phero-grid"><div>${eyebrow([x.name,x.pair],t)}<h1>${x.h1}</h1><p class="lead">${x.lead}</p>${ctaRow(t)}${micro(t)}</div><div class="phero-art">${art}</div></div>
  <div class="brief"><p class="brief-l">${t.ui.brief}</p><dl class="facts">${x.facts.map(([k,v])=>`<div class="fact"><dt>${k}</dt><dd>${v}</dd></div>`).join("")}</dl></div>
 </div></section>`;
 const [nt,nd,nl,nlt]=x.note;
 let aside="";
 if(x.vocab){
  const ar=state.lang==="ar",row=(a,b,cls)=>`<div class="vocab-row ${cls||""}">${ar?`<span class="v-ar" lang="ar">${b}</span><span class="v-it" lang="it" dir="ltr">${a}</span>`:`<span class="v-it" lang="it">${a}</span><span class="v-ar" lang="ar" dir="rtl">${b}</span>`}</div>`;
  aside=`<div class="vocab"><div class="vocab-row vocab-head">${ar?`<span>${x.vocabT[1]}</span><span>${x.vocabT[0]}</span>`:`<span>${x.vocabT[0]}</span><span>${x.vocabT[1]}</span>`}</div>${x.vocab.map(([a,b])=>row(a,b)).join("")}</div>`;
 }
 const note=`<div class="note"><div>${eyebrow([state.lang==="ar"?"من المهم أن تعرف":"Da sapere"],t)}<h3>${nt}</h3></div><div><p>${nd}</p>${nl?`<a class="link-arrow" href="${href(nl)}">${nlt}${I.arrow}</a>`:""}${aside?`<div style="margin-top:22px">${aside}</div>`:""}</div></div>`;
 const what=`<div class="wrap"><div class="sec-head"><div>${eyebrow(t.eb.detail,t)}<h2>${x.whatT}</h2></div></div>
  <div class="items">${x.items.map(([a,b])=>`<div class="item"><span class="arch-dot"></span><h3>${a}</h3><p>${b}</p></div>`).join("")}</div>${note}</div>`;
 const steps=x.stepsT?stepsSec(t,x.stepsT,"",x.steps||t.steps):null;
 const others=`<div class="wrap"><div class="sec-head"><div>${eyebrow(t.eb.other,t)}<h2>${t.ui.other}</h2></div></div>
  <div class="others">${ALLSVC.filter(o=>o!==s).map(o=>`<a class="other" href="${href(o)}"><span class="mini-arch">${I[SVC_ICON[o]]}</span><strong>${t.svc[o].name}</strong><span class="d">${t.svc[o].short}</span><span class="more">${t.ui.discover}${I.arrow}</span></a>`).join("")}</div></div>`;
 return hero+sections([what,steps,faqSec(t,x.faq),others])+ctaBand(t);
}

      <div class="field" data-quote><label for="f-date">${c.date} <span class="opt">(${c.optional})</span></label><input id="f-date" name="date" type="date"></div>
      <div class="field full" data-quote><span class="lbl">${c.fileL} <span class="opt">(${c.optional})</span></span>
       <label class="drop" id="drop"><span class="up">${I.upload}</span><span><strong>${c.fileMain}</strong><small>${c.fileHint}</small></span><input type="file" id="f-file" multiple accept=".pdf,.jpg,.jpeg,.png,.doc,.docx" aria-label="${c.fileL}"></label>

   </div>
   <aside class="cinfo">
    <div class="ccard ccard-wa"><span class="ci">${I.wa}</span><span><span class="k">${c.waK}</span><span class="v">WhatsApp · ${bdi(PHONE)}</span></span><a class="btn btn-wa" href="${waLink(t)}" target="_blank" rel="noopener">${I.wa}${c.waBtn}</a></div>
    <div class="ccard"><span class="ci">${I.phone}</span><span><span class="k">${c.phoneK}</span><span class="v">${bdi(PHONE)}</span></span><button type="button" class="copy" data-copy="${PHONE}">${I.copy}<span>${t.ui.copy}</span></button></div>
    <div class="ccard"><span class="ci">${I.mail}</span><span><span class="k">${c.emailK}</span><span class="v">${bdi(EMAIL)}</span></span><button type="button" class="copy" data-copy="${EMAIL}">${I.copy}<span>${t.ui.copy}</span></button></div>
    <div class="ccard"><span class="ci">${I.pin}</span><span><span class="k">${c.studioK}</span><span class="v">${c.studioV}</span><span class="sub">${c.studioS}</span></span></div>
    <div class="ccard"><span class="ci">${I.clock}</span><span><span class="k">${c.hoursK}</span><span class="v">${c.hoursV}</span><span class="sub">${c.hoursS}</span></span></div>

function openSeo(){
 const t=S[state.lang],u=t.seoUi,[st,sd,kw]=t.seo[state.page],dlg=$("#seo");
 const path=(state.lang==="ar"?" › ar":"")+(state.page==="home"?"":" › "+state.page);
 const url="/"+(state.lang==="ar"?"ar/":"")+(state.page==="home"?"":state.page+"/");
 const tl=[...st].length,dl=[...sd].length,h1=($("main h1")||{}).textContent||"";
 const ok=b=>`<span class="st${b?"":" warn"}">${b?I.check:"!"}</span>`;
 dlg.setAttribute("dir",t.dir);dlg.setAttribute("lang",state.lang);
 dlg.innerHTML=`<div class="seo-in">
  <div class="seo-head"><div><p class="eyebrow"><span>${u.eyebrow}</span></p><h2 id="seo-title">${u.title}</h2><p class="seo-sub">${u.sub}</p></div><button type="button" class="icon-btn" data-close-seo aria-label="${t.ui.close}">${I.close}</button></div>
  <div class="serp"><div class="serp-site"><span class="serp-fav">${LOGO}</span><span><span class="serp-name">${t.ui.brand}</span><span class="serp-url" dir="ltr">https://${DOMAIN}${path}</span></span></div><p class="serp-t">${st}</p><p class="serp-d">${sd}</p></div>
  <ul class="seo-checks">
   <li><span>${u.t}</span><span class="val">${bdi(tl+" / 60")} ${u.chars}</span>${ok(tl<=60)}</li>
   <li><span>${u.d}</span><span class="val">${bdi(dl+" / 160")} ${u.chars}</span>${ok(dl<=160&&dl>=70)}</li>
   <li><span>${u.h1}</span><span class="val">${esc(h1)}</span>${ok(!!h1)}</li>
   <li><span>${u.url}</span><span class="val">${bdi(url)}</span>${ok(true)}</li>
   <li><span>${u.hreflang}</span><span class="val">${bdi("it ⇄ ar")}</span>${ok(true)}</li>
   <li><span>${u.schema}</span><span class="val">${bdi("ProfessionalService")}</span>${ok(true)}</li>
  </ul>
  <p class="kw-l">${u.kw}</p><div class="chips">${kw.map(k=>`<span class="chip">${k}</span>`).join("")}</div>
  <p class="seo-note">${u.note}</p>
 </div>`;
 if(dlg.showModal){try{dlg.showModal()}catch(e){dlg.setAttribute("open","")}}else dlg.setAttribute("open","");
}
function closeSeo(){const d=$("#seo");if(d.close)d.close();else d.removeAttribute("open")}

function bindForm(){
 const form=$("#cform");if(!form)return;
 const c=S[state.lang].contact;let files=[];
 const fmt=b=>b<1024*1024?Math.max(1,Math.round(b/1024))+" KB":(b/1048576).toFixed(1)+" MB";
 const list=$("#flist"),inp=$("#f-file"),drop=$("#drop");
 const draw=()=>{list.innerHTML=files.map((x,i)=>`<li>${I.file}<span class="fn">${esc(x.name)}</span><span class="fs">${bdi(fmt(x.size))}</span><button type="button" data-rm="${i}" aria-label="${c.remove}">${I.close}</button></li>`).join("")};
 inp.addEventListener("change",()=>{files=files.concat([...inp.files]);inp.value="";draw()});
 ["dragenter","dragover"].forEach(ev=>drop.addEventListener(ev,()=>drop.classList.add("drag")));
 ["dragleave","drop"].forEach(ev=>drop.addEventListener(ev,()=>drop.classList.remove("drag")));
 list.addEventListener("click",e=>{const b=e.target.closest("[data-rm]");if(b){files.splice(+b.dataset.rm,1);draw()}});
 const setMode=m=>{$$("[data-tab]").forEach(b=>b.setAttribute("aria-selected",String(b.dataset.tab===m)));$$("[data-quote]").forEach(el=>el.hidden=m!=="quote")};
 $$("[data-tab]").forEach(b=>b.addEventListener("click",()=>setMode(b.dataset.tab)));
 const setErr=(el,msg)=>{el.setAttribute("aria-invalid",msg?"true":"false");const e=$("#e-"+el.id);if(e)e.textContent=msg};
 form.addEventListener("input",e=>{if(e.target.getAttribute("aria-invalid")==="true")setErr(e.target,"")});
 form.addEventListener("change",e=>{if(e.target.id==="f-consent"&&e.target.checked)setErr(e.target,"")});
 form.addEventListener("submit",e=>{
  e.preventDefault();let first=null;
  const chk=(id,okFn,msg)=>{const el=$("#"+id),ok=okFn(el);setErr(el,ok?"":msg);if(!ok&&!first)first=el};
  chk("f-name",el=>el.value.trim().length>1,c.errReq);
  chk("f-email",el=>/^[^\s@]+@[^\s@]+\.[^\s@]{2,}$/.test(el.value.trim()),c.errEmail);
  chk("f-msg",el=>el.value.trim().length>2,c.errReq);
  chk("f-consent",el=>el.checked,c.errConsent);
  if(first){first.focus();return}
  form.hidden=true;$(".tabs").hidden=true;$("#csuccess").hidden=false;$("#csuccess").scrollIntoView({block:"center"});
 });
 $("[data-again]").addEventListener("click",()=>{form.reset();files=[];draw();setMode("quote");form.hidden=false;$(".tabs").hidden=false;$("#csuccess").hidden=true});
}

function closeDd(){$$(".dd.open").forEach(d=>{d.classList.remove("open");$(".dd-btn",d).setAttribute("aria-expanded","false")})}
function toggleMenu(open){
 const m=$("#mnav"),b=$("[data-menu]");if(!m||!b)return;
 if(open===undefined)open=m.hidden;
 if(open){m.style.setProperty("--mnav-top",$("#hdr").getBoundingClientRect().bottom+"px")}
 m.hidden=!open;b.setAttribute("aria-expanded",String(open));
 b.innerHTML=(open?I.close:I.menu)+`<span class="sr">${open?S[state.lang].ui.close:S[state.lang].ui.menu}</span>`;
 document.documentElement.classList.toggle("lock",open);
}

function render(){
 const t=S[state.lang],root=document.documentElement;
 root.lang=state.lang;root.dir=t.dir;root.classList.remove("lock");
 $("#top").innerHTML=header(t);
 const main=$("#main");
 main.innerHTML=(VIEWS[state.page]||vService)(t,state.page);
 $("#bottom").innerHTML=footer(t);
 document.title=t.seo[state.page][0];
 main.classList.remove("enter");void main.offsetWidth;main.classList.add("enter");
 if(state.page==="contatti")bindForm();
}
function go(page,lang){
 lang=lang||state.lang;
 const keep=page===state.page&&lang!==state.lang,y=window.scrollY;
 state={lang,page};
 try{localStorage.setItem("mk-lang",lang)}catch(e){}
 try{history.pushState(null,"","#"+lang+"-"+page)}catch(e){}
 render();
 window.scrollTo(0,keep?y:0);
}
function parseHash(){const m=(location.hash||"").match(/^#(it|ar)-([a-z-]+)$/);return m&&PAGES.includes(m[2])?{lang:m[1],page:m[2]}:null}

document.addEventListener("click",e=>{
 const a=e.target.closest('a[href^="#it-"],a[href^="#ar-"]');
 if(a){const m=a.getAttribute("href").match(/^#(it|ar)-(.+)$/);if(m&&PAGES.includes(m[2])){e.preventDefault();closeDd();toggleMenu(false);go(m[2],m[1]);return}}
 const dd=e.target.closest("[data-dd]");
 if(dd){const w=dd.parentElement,o=!w.classList.contains("open");closeDd();if(o){w.classList.add("open");dd.setAttribute("aria-expanded","true")}return}
 if(!e.target.closest(".dd"))closeDd();
 if(e.target.closest("[data-menu]")){toggleMenu();return}
 if(e.target.closest("[data-seo]")){openSeo();return}
 if(e.target.closest("[data-close-seo]")||e.target.id==="seo"){closeSeo();return}
 const cp=e.target.closest("[data-copy]");
 if(cp){
  const lab=$("span",cp),orig=lab.textContent,done=()=>{lab.textContent=S[state.lang].ui.copied;setTimeout(()=>{lab.textContent=orig},1600)};
  const sel=()=>{const v=$(".v",cp.closest(".ccard"));const r=document.createRange();r.selectNodeContents(v);const s=getSelection();s.removeAllRanges();s.addRange(r)};
  try{navigator.clipboard.writeText(cp.dataset.copy).then(done,sel)}catch(err){sel()}
 }
});
document.addEventListener("focusout",e=>{const dd=e.target.closest&&e.target.closest(".dd");if(dd&&!dd.contains(e.relatedTarget))closeDd()});
document.addEventListener("keydown",e=>{if(e.key==="Escape"){closeDd();toggleMenu(false)}});
window.addEventListener("popstate",()=>{const r=parseHash();if(r){state=r;render()}});
window.addEventListener("hashchange",()=>{const r=parseHash();if(r&&(r.lang!==state.lang||r.page!==state.page)){state=r;render();window.scrollTo(0,0)}});
window.addEventListener("resize",()=>{if(window.innerWidth>=1180)toggleMenu(false)});

(function init(){
 let lang="it";try{lang=localStorage.getItem("mk-lang")==="ar"?"ar":"it"}catch(e){}
 state=parseHash()||{lang,page:"home"};
 render();
})();
</script>

</body></html>
